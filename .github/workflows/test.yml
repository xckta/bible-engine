name: Bible Engine regression suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Startup runtime contracts
        run: python scripts/check_runtime_contracts.py
      - name: Python tests
        run: python -m pytest
      - name: First-run graph integration
        env:
          BIBLE_DB_PATH: /tmp/bible-engine-graph.db
        run: |
          python scripts/seed_intertext_graph.py
          python scripts/check_intertext_graph.py
      - name: First-run textual witness integration
        env:
          BIBLE_DB_PATH: /tmp/bible-engine-witnesses.db
        run: |
          python scripts/seed_textual_witnesses.py
          python scripts/check_textual_witnesses.py
      - name: First-run Atlas integration
        env:
          BIBLE_DB_PATH: /tmp/bible-engine-atlas.db
          BIBLE_ATLAS_SOURCE: /tmp/openbible-ancient.jsonl
        run: |
          python scripts/seed_atlas.py
          python scripts/check_atlas.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/original.js
          node --check app/static/originals.js
          node --check app/static/graph.js
          node --check app/static/research.js
          node --check app/static/atlas.js
      - name: Python compile check
        run: python -m compileall -q app scripts tests

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        shell: pwsh
        run: python -m pip install -e '.[dev]'
      - name: Windows startup runtime contracts
        shell: pwsh
        run: python scripts/check_runtime_contracts.py
      - name: Windows Python tests
        shell: pwsh
        run: python -m pytest
      - name: Windows graph first-run smoke
        shell: pwsh
        env:
          BIBLE_DB_PATH: ${{ runner.temp }}\bible-engine-graph.db
        run: |
          python scripts/seed_intertext_graph.py
          python scripts/check_intertext_graph.py
      - name: Windows Atlas first-run smoke
        shell: pwsh
        env:
          BIBLE_DB_PATH: ${{ runner.temp }}\bible-engine-atlas.db
          BIBLE_ATLAS_SOURCE: ${{ runner.temp }}\openbible-ancient.jsonl
        run: |
          python scripts/seed_atlas.py
          python scripts/check_atlas.py
      - name: PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/start_windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'start_windows.ps1 syntax OK'
