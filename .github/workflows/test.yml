name: Bible Engine regression suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Python tests
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/original.js
          node --check app/static/graph.js
      - name: Python compile check
        run: python -m compileall -q app scripts tests
