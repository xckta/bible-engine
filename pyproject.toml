[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-engine"
version = "2.0.0"
description = "Local provenance-first biblical research operating system with Oracle synthesis, studies, original languages, intertext graph, textual witnesses, evidence workbench, biblical atlas, and custom corpus vault."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
